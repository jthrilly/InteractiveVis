<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Visualization</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<!-- Region outlines: plain SVG path strings keyed by region id -->
<script src="js/usstates.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>

<div id="map" class="map" data-shapes="usmap"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<p id="loaderror" class="loaderror" role="alert" hidden></p>

<div id="mainpanel">
  <div class="col">
    <div id="maintitle"></div>
    <div id="title"></div>
    <div id="titletext"></div>
    <p id="moreinformation" class="info">
      <a href="#information" class="line">More about this visualisation</a>
    </p>
    <div id="legend">
      <h2 id="legendtitle"></h2>
      <ul id="legendColors"></ul>
    </div>
  </div>
</div>

<div id="zoom" role="group" aria-label="Map zoom">
  <button type="button" class="z" id="zoomIn" title="Zoom in" aria-label="Zoom in"></button>
  <button type="button" class="z" id="zoomOut" title="Zoom out" aria-label="Zoom out"></button>
  <button type="button" class="z" id="reset" title="Reset view" aria-label="Reset view"></button>
</div>

<aside id="attributepane" aria-live="polite">
  <button type="button" title="Close" aria-label="Close information pane" class="left-close"></button>
  <h2 class="headertext" id="chartname">Information Pane</h2>
  <div class="panel">
    <div id="chart" class="chart"></div>
    <div id="attributeText"></div>
  </div>
</aside>

<dialog id="information" aria-labelledby="informationTitle">
  <form method="dialog" class="dialog-close"><button type="submit" aria-label="Close">&times;</button></form>
  <h2 id="informationTitle" class="visually-hidden">More about this visualisation</h2>
  <div id="informationContent"></div>
</dialog>

<footer id="credits">
  <div id="jisc"><a href="http://jisc.ac.uk" title="JISC"><span>JISC</span></a></div>
  <!-- <div id="oii"><a href="http://oii.ox.ac.uk" title="OII"><span>OII</span></a></div> -->
  <div id="copyright">
    <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/3.0/"><img alt="Creative Commons Attribution-NonCommercial-ShareAlike 3.0 License" src="images/CC.png"></a>
  </div>
</footer>

</body>
</html>
